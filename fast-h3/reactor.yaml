# Reactor model specification for the FastH3 continuous channel.
$schema: reactor/v1

model:
  name: fast-h3
  # Bare semver, no `v` prefix — the platform's release tag format; the
  # registration validator refuses a prefixed one.
  version: 0.6.0
  description: |
    Generate video with synchronized audio from MiniMax-H3 (35B), distilled by
    FastVideo to four transformer forwards with 90% sparse video attention. Two
    modes: a continuous single-prompt take that chains and crossfades clips into
    one uninterrupted stream (`set_prompt`), and a clip queue that builds
    enqueued prompts in order and plays any built clip on demand
    (`enqueue`/`play`), holding on black in between.
  # Eight Blackwell GPUs: the count that builds faster than the stream plays
  # (~12.9 s for a 15 s clip on eight B200s, against ~15.5-17 s on four). A
  # 24/7 feed needs builds to outpace playback or every clip boundary waits
  # on the GPUs, so the extra four buy the realtime headroom, not just
  # shorter enqueue-to-ready waits. The count must divide H3's 56 attention
  # heads (1, 2, 4, 7, 8 …). The image serves B200 and B300 (Blackwell
  # Ultra, compute capability 10.3) with the same profile; its kernels are
  # compiled for both 10.0a and 10.3a — see TORCH_CUDA_ARCH_LIST below.
  #
  # The CPU allocation is measured, not guessed. The engine runs nine
  # processes (the runtime plus eight spawned workers), and NCCL host
  # threads, kernel-launch threads, and the decode gather all burn CPU
  # between collectives. At request 8 / limit 32 on a 192-vCPU HGX B200
  # node the cgroup throttled 38% of CFS periods and the pod built at
  # 0.85x realtime against 1.16x on identical unthrottled silicon (denoise
  # 9.5 s vs 5 s, latent prep 1.65 s vs 0.3 s). Request and limit are both
  # pinned at the account's model CPU quota (the registry 429s any limit
  # above it) — the full quota guaranteed, none of it burstable — and
  # OMP_NUM_THREADS in runtime_env stops the over-threading that amplified
  # the throttle. Raise toward 64/128 if the quota moves again.
  #
  # memory: with nothing CPU-offloaded the host holds the load-time
  # transient of eight ranks streaming a 148 GB bundle plus the built-clip
  # buffer — about 1 GB of uint8 pixels per queued clip, bounded by
  # inference.queue_size in fasth3.yaml. If the offload flags in
  # fasth3.yaml are turned back on, memory must rise to several hundred Gi
  # (8 ranks × ~63 GB pinned) — see the note there.
  resources:
    gpu:
      type: NVIDIA_B200
      count: 8
    cpu:
      request: "64"
      limit: "64"
    # Sized for the resident text encoder: on eight dedicated Blackwell GPUs
    # each rank holds its own copy in VRAM (fasth3.yaml turns the offload
    # off), so the host carries only the load transient and the built-clip
    # buffer.
    memory:
      request: 64Gi
      limit: 256Gi

runtime:
  import: fasth3:FastH3
  config: fasth3.yaml
  # The weights bundle lives here; nothing is downloaded at load.
  weights_path: ~/.cache/reactor_registry/fast-h3
  # Left off deliberately. Every clip is generated independently and the stream
  # holds on black between plays, so a recording carries hard cuts in picture
  # and sound at each boundary; enable it once that seam has been looked at.
  recording:
    enabled: false

build:
  runtime_version: "3.2.6"
  python_requirements: requirements.txt
  # CUDA 13 is the model's requirement, not a preference: the VSA-H3 sparse
  # kernel and the FA4 CuTe kernels are both cu130 builds. Every other model in
  # this repo builds on 12.8.1.
  cuda_version: "13.1.2"
  python_version: "3.12"
  # ninja keeps any torch BuildExtension parallel — without it torch falls back
  # to serial g++ and a 30-minute build runs for hours. git is what pip drives
  # to resolve the `git+https` flash-attn-4 requirement. libgl1 + libglib2.0-0
  # are for opencv: fastvideo depends on `opencv-python` (the GUI build), not
  # `opencv-python-headless`, so the GUI shared libraries have to be present or
  # the first `import cv2` dies on `libGL.so.1`.
  system_packages:
    - build-essential
    - ffmpeg
    - git
    - libgl1
    - libglib2.0-0
    - ninja-build
  # torch comes from the cu130 index in requirements.txt; let the resolver
  # compare that index with PyPI for everything the index also mirrors.
  # UV_OVERRIDE feeds the requirements back in as resolver overrides, which is
  # what lets the runtime's protobuf>=7.35.1 defeat cutlass-dsl's stale <7 cap
  # — see the protobuf note in requirements.txt.
  build_env:
    UV_INDEX_STRATEGY: unsafe-best-match
    UV_OVERRIDE: /app/requirements.txt
    # fastvideo-kernel and flash-attn-4 compile from source during the
    # build (see requirements.txt). Arch-specific (`a`) binaries do not run
    # forward even within a family, so the list carries both Blackwell
    # (10.0a, B200) and Blackwell Ultra (10.3a, B300) and the image serves
    # either. The kernel package's Python-side gate only accepts (10, 0),
    # though — sitecustomize.py widens it to this list; keep the two in
    # sync (_VSA_BUILT_CAPABILITIES) or a B300 silently serves the ~2.5x
    # slower Triton route in eager mode. When this list changes, build once
    # with UV_NO_CACHE=1: uv keys its built-wheel cache on the source
    # revision alone and would silently reuse the wheel compiled for the
    # old arch list.
    TORCH_CUDA_ARCH_LIST: "10.0a;10.3a"
    CMAKE_BUILD_PARALLEL_LEVEL: "32"
    MAX_JOBS: "32"
  # Long-lived server allocating a clip's worth of pixels over and over, in two
  # different shapes: the expandable-segments allocator is what stops
  # fragmentation creeping across a multi-hour channel.
  #
  # Every component loads from the local bundle, so the HF libraries must never
  # reach for the network — offline turns a missing file into a clear error
  # instead of a hang.
  #
  # PYTHONPATH=/app is load-bearing: it makes every Python interpreter in the
  # container — the runtime and each engine worker FastVideo spawns — import
  # /app/sitecustomize.py at start, the only place its two fixes can land
  # inside the spawned workers: raising dynamo's recompile limit (torch 2.12
  # maps no env var onto it, and FastVideo's own imports re-cap it at 16;
  # sized by FASTH3_DYNAMO_RECOMPILE_LIMIT to the 14 legal clip lengths
  # times the warmed canvases, with headroom) and widening the VSA kernel's
  # device gate to every arch in TORCH_CUDA_ARCH_LIST above.
  runtime_env:
    PYTORCH_ALLOC_CONF: expandable_segments:True
    HF_HUB_OFFLINE: "1"
    TRANSFORMERS_OFFLINE: "1"
    PYTHONPATH: /app
    FASTH3_DYNAMO_RECOMPILE_LIMIT: "64"
    # torch sizes its intra-op threadpools from nproc, which reports the
    # whole node inside the container (192 on the hosted HGX nodes), so
    # nine processes pile thousands of runnable threads against the CPU
    # quota and CFS throttles them (measured: 38% of periods at limit 32).
    # Eight threads per process keeps the total under resources.cpu.
    OMP_NUM_THREADS: "8"
